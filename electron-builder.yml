appId: com.vikingstech.masterpdf
productName: Vikings Master PDF
copyright: Copyright © 2026 Vikings Technologies

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc.json,tailwind.config.cjs,postcss.config.cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,playwright.config.ts}'

asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'

# ---------------------------------------------------------------------------
# Windows (Phase 1)
# ---------------------------------------------------------------------------
win:
  executableName: VikingsMasterPDF
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vikings Master PDF
  uninstallDisplayName: Vikings Master PDF
  deleteAppDataOnUninstall: false

fileAssociations:
  - ext: pdf
    name: PDF Document
    description: Portable Document Format
    role: Editor

# ---------------------------------------------------------------------------
# macOS (Phase 2)
# ---------------------------------------------------------------------------
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

# ---------------------------------------------------------------------------
# Linux (Phase 3)
# ---------------------------------------------------------------------------
linux:
  icon: build/icons
  category: Office
  maintainer: Vikings Technologies
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]

# ---------------------------------------------------------------------------
# Auto update — published to GitHub Releases. electron-builder bakes this block
# into the app as app-update.yml, so the installed app checks this repo's
# Releases for new versions and updates itself in place. The repo is public,
# so no token is needed by clients to read releases.
# ---------------------------------------------------------------------------
publish:
  provider: github
  owner: kvikash31iitk-lab
  repo: VIKINGS-MASTER-PDF
  releaseType: release

npmRebuild: true
