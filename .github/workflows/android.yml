name: Android CI

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble · Lint (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK to Releases
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vikings-master-pdf-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Publish to a permanent, login-free download link under Releases.
      # Uses a moving "debug-latest" tag, so the URL never changes:
      #   https://github.com/<owner>/<repo>/releases/download/debug-latest/app-debug.apk
      - name: Publish debug APK to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug APK (latest)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automatically published debug build.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
