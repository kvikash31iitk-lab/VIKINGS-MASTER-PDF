name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Manual trigger: builds installers from any branch without a release tag.
  workflow_dispatch:
    inputs:
      build_installers:
        description: 'Build Windows/Linux installers'
        type: boolean
        default: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run Playwright against the built app (virtual display)
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  package-windows:
    name: Package Windows installer
    runs-on: windows-latest
    needs: quality
    # Tag releases, manual dispatch, or any push whose message opts in.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
      contains(github.event.head_commit.message, '[build-installers]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/**/*.exe

  package-linux:
    name: Package Linux builds
    runs-on: ubuntu-latest
    needs: quality
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
      contains(github.event.head_commit.message, '[build-installers]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
